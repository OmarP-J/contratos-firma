{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block cuerpo %}
<main class="marco">
  <div class="tarjeta">
    <h1>Administracion</h1>
    <p class="sutil">Entra con tu correo y tu clave. Despues te pediremos el codigo de tu app
    autenticadora.</p>
    {% if aviso %}<div class="aviso">{{ aviso }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/entrar">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" value="{{ email or '' }}" required autofocus>
      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>
      <p></p>
      <button type="submit">Continuar</button>
    </form>
  </div>
</main>
{% endblock %}
