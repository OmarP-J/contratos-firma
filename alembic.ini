# Migraciones del esquema. La URL de la base NO va aqui: sale de URL_BASE_DATOS,
# la misma variable que usa el servicio (ver migraciones/env.py).
#
#   alembic upgrade head                                   aplicar lo pendiente
#   alembic revision --autogenerate -m "que cambia"        nueva migracion

[alembic]
script_location = migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
